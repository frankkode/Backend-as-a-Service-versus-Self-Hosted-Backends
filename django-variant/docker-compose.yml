services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: .
    environment:
      - GUNICORN_WORKERS=${GUNICORN_WORKERS}
    env_file: .env
    depends_on: [db]
    volumes: ["../shared:/shared:ro", ".:/app"]
  nginx:
    image: nginx:alpine
    volumes: ["./nginx.conf:/etc/nginx/conf.d/default.conf"]
    ports: ["80:80", "443:443"]
    depends_on: [web]
volumes:
  pgdata:
